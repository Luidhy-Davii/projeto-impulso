<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Guerra | Impulso</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/oracao.scss">
</head>

<body class="pagina-oracao">
    <nav class="oracao-nav">
        <a href="../../../index.html" target="_blank" rel="noopener noreferrer" class="botao-sair">SAIR</a>
    </nav>

    <main class="tela-setup js-tela-setup">
        <h1 class="titulo-setup">Sala de Guerra</h1>
        <p class="subtitulo-setup">Prepare seu coração. Escolha o tempo:</p>

        <div class="seletor-tempo">
            <button class="botao-tempo js-botao-tempo" data-minutos="3">3 MIN</button>
            <button class="botao-tempo js-botao-tempo ativo" data-minutos="5">5 MIN</button>
            <button class="botao-tempo js-botao-tempo" data-minutos="10">10 MIN</button>
        </div>

        <button class="botao-iniciar js-botao-iniciar">INICIAR SESSÃO</button>
    </main>

    <section class="tela-oracao js-tela-oracao">
        <div class="circulo-respiracao">
            <svg class="svg-progresso">
                <circle class="js-circulo-progresso" cx="160" cy="160" r="150"></circle>
            </svg>
            <div class="ponto-central js-ponto-central"></div>
        </div>

        <div class="conteudo-fase js-conteudo-fase">
            <span class="fase-label js-fase-label">FASE 1</span>
            <h2 class="fase-titulo js-fase-titulo">ADORAÇÃO</h2>
            <p class="fase-desc js-fase-desc">Foque em quem Deus é.</p>
        </div>

        <div class="cronometro js-cronometro">00:00</div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="./scripts/oracao.js"></script>
</body>

</html>
